name: Windows handover
on:
  pull_request:
  push:
    branches: ['project/**']
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    env:
      MPLBACKEND: Agg
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install and exercise the package without licensed inputs
        shell: powershell
        run: |
          .\WINDOWS_HANDOVER\INSTALL_WINDOWS.ps1 -Browser
          .\WINDOWS_HANDOVER\OPEN_POWERBI.ps1 -NoOpen
          .\WINDOWS_HANDOVER\RUN_TESTS.ps1 -Browser
      - name: Confirm the PowerShell Streamlit launcher
        shell: powershell
        timeout-minutes: 3
        run: |
          $stdout = Join-Path $env:RUNNER_TEMP 'wns-streamlit.stdout.log'
          $stderr = Join-Path $env:RUNNER_TEMP 'wns-streamlit.stderr.log'
          $server = Start-Process -FilePath powershell.exe -ArgumentList @(
            '-NoProfile', '-NonInteractive', '-File', '.\WINDOWS_HANDOVER\RUN_STREAMLIT.ps1',
            '-Synthetic', '-Port', '8769'
          ) -WorkingDirectory (Get-Location).Path -RedirectStandardOutput $stdout -RedirectStandardError $stderr -PassThru
          try {
            $deadline = [DateTime]::UtcNow.AddSeconds(45)
            while ([DateTime]::UtcNow -lt $deadline -and -not $server.HasExited) {
              $health = curl.exe --silent --fail --noproxy '*' --max-time 2 http://127.0.0.1:8769/_stcore/health
              if ($LASTEXITCODE -eq 0 -and $health -eq 'ok') {
                Write-Host 'PowerShell Streamlit launcher answered its health endpoint.'
                return
              }
              Start-Sleep -Seconds 1
            }
            throw 'PowerShell Streamlit launcher did not answer its local health endpoint.'
          }
          finally {
            if (-not $server.HasExited) { taskkill.exe /PID $server.Id /T /F | Out-Host }
            Get-Content -LiteralPath $stdout, $stderr
          }
