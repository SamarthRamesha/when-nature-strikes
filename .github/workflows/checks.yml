name: Project checks
on:
  pull_request:
  push:
    branches: [main, 'project/**']
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/package_submission.py --check-tracked
      - run: python -m pip install -r requirements-ci.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q src scripts dashboard tests
      - run: python scripts/check_submission.py
